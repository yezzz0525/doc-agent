server:
  port: 8081

spring:
  application:
    name: doc-agent

  # PostgreSQL 连接信息（只有 doc-agent.vector-store.type=pgvector 时才真正连库；
  # 平时用内存向量库，配着也不影响启动——连接池是懒加载的，不用就不连）
  datasource:
    url: jdbc:postgresql://localhost:5432/docagent
    username: docagent
    password: docagent123

  ai:
    openai:
      # ==========================================================================
      # 对话：阿里云百炼（通义千问）    向量：硅基流动 bge-m3
      # ==========================================================================
      # 两家分开，各用各的 Key。这不是配置乱，是**有意为之**：
      # 向量模型绝对不能换 —— 库里 319 个片段是 bge-m3 生成的向量，
      # 换模型就等于换了坐标系，旧向量全部作废，必须重建索引。
      # 换对话模型则完全不影响索引。
      #
      # ── 百炼怎么拿 Key ──────────────────────────────────────────────────────
      #   1. 访问 https://bailian.console.aliyun.com/ 用手机号登录
      #   2. 左侧「API-KEY」→ 创建 API Key
      #   3. **务必先处理欠费**：实名称户免费额度用完会自动转按量计费，
      #      不报错、直接扣钱。请在「费用中心」确认余额，并开启「免费额度用完即停」
      #      本项目之前就踩过这个坑（额度耗尽后欠费 0.07 元）
      #
      # ── 模型名 ────────────────────────────────────────────────────────────
      #   当前用的是老名字 qwen-flash（最便宜那档）。如果报「模型不存在」，
      #   说明它已下线，去控制台模型列表照抄当前可用的，备选：
      #     qwen3.8-flash   最新轻量模型
      #     qwen3.6-flash   更成熟
      #     qwen3.7-plus    明显更强，也更贵
      #   （2026-10 百炼主推 qwen3.x 系列）
      #
      # ── 计费参考（元 / 百万 token）────────────────────────────────────────
      #   qwen-flash（旧）  输入 0.18 / 输出 1.8
      #   qwen-plus         输入 0.8  / 输出 2
      #   本项目一次问答约 3000 输入 + 500 输出，每天 30 次
      #   → 每月约 270 万输入 + 45 万输出 ≈ 1~3 元。
      #   注意【输出单价约为输入的 10 倍】，让它少写字比少读资料更省。
      #
      # ── 备用服务商（想换只改这三行）────────────────────────────────────────
      #   硅基流动（对话也免费，30 RPM，一个 Key 就能搞定对话+向量）：
      #     base-url: https://api.siliconflow.cn/v1
      #     api-key:  ${SILICONFLOW_API_KEY}
      #     chat: { model: Qwen/Qwen3-8B }
      #   百度千帆（永久免费不限量 QPS=50）：
      #     base-url: https://qianfan.baidubce.com/v2
      #     api-key:  ${BAIDU_API_KEY}
      #     chat: { model: ernie-speed-8k }
      # ==========================================================================
      # ⚠️ 域名是 aliyuncs（阿里云 ECS 的域名），不是 aliyun —— 写错会返回
      #    404 HTML 错误页而不是 JSON 报错，排查起来很误导人（看着像 Key 问题，其实是地址错）。
      #    这就是 tools/check_config.py 存在的原因：配完先跑一遍自检。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        # qwen-flash 是百炼最便宜的档位（输入 0.18 / 输出 1.8 元每百万 token），
        # 对本项目这种"基于文档摘要 + 闲聊 + 联网搜索"的负载完全够用。
        # ⚠️ 如果报「模型不存在」，说明这个名字已下线，换成 qwen3.8-flash 即可（一行的事）
        model: qwen-flash

      # 向量继续留在硅基流动 —— 专属配置覆盖下面的公共配置。
      # ⚠️⚠️ 千万别把这里也改成百炼！百炼的 text-embedding-v3 和 bge-m3
      #         向量空间完全不同，库里的 319 个片段会全部变成废数据。
      # ⚠️ 模型代码必须是 BAAI/bge-m3（基础版，免费）；
      #    写成 Pro/BAAI/bge-m3 就是收费版（0.07 元/百万 token）。
      # 向量维度 1024，与 doc-agent.vector-store.dimensions 必须一致。
      embedding:
        base-url: https://api.siliconflow.cn/v1
        api-key: ${SILICONFLOW_API_KEY}
        model: BAAI/bge-m3

# 本项目自己的配置
doc-agent:
  intent:
    # 意图分类要不要调模型。默认 false = 纯规则（快、免费、不撞限速）
    # 打开后会多一次对话模型调用，在智谱「仅 1 并发」的免费档下很容易撞 429。
    # 换成不限并发的服务商（如百度千帆 QPS=50）后可以打开，届时规则覆盖不到的
    # 问法会交给模型判断，判定结果会打 info 日志，方便回头补关键词。
    use-model-classify: false
  web-search:
    # 联网搜索（仅对「普通对话」分支生效，RAG 分支保持纯本地知识库）
    # 通过百炼的 enable_search 参数实现，走 Spring AI 的 extraBody 传递，
    # 不需要自己造 HTTP 请求。效果：问"今天天气/最新版本/新闻"时模型会自己去搜。
    #
    # ⚠️ 代价：搜到的网页正文会进 prompt，输入 token 可能涨 5~10 倍。
    #    qwen-flash 输入 0.18 元/百万，每天 30 次的话一个月也就几块钱。
    #
    # ⚠️ 如果你把 chat 换成别家服务商（智谱/硅基流动/百度），这两个参数会被忽略，
    #    联网搜索自动失效——它们是百炼特有的。需要自己写 Tool Use 才能跨服务商。
    enabled: true
    # standard —— 普通搜索，非流式也能用
    # agent_max —— 会顺带抓取网页正文（web_extractor），信息更全，
    #              但百炼【明确不支持非流式输出】，只能在流式接口里用
    strategy: standard
  vector-store:
    # 用哪套向量库：
    #   pgvector —— 存进 PostgreSQL。天然持久化、可被多个实例共享、能建索引加速检索（当前）
    #   simple   —— 内存向量库 + JSON 落盘。零依赖，不需要起数据库，适合小数据量
    #
    # 切换后务必重新点一次「加载文档」——两套库的数据是各存各的，不会自动迁移。
    # 切回 simple 时：改回下面的值，并把 data/vector-index.json 和 .stats 移回原名即可
    #（它们一直保留着，没删）。
    type: pgvector
    # pgvector 模式下的表名
    table: vector_store
    # 向量维度，必须和 embedding 模型的输出一致。bge-m3 = 1024，写错会报维度不匹配
    dimensions: 1024
  embedding:
    # 硅基流动免费模型有固定速率上限，加载 319 段时很容易撞 429。
    # 下面是三道保险，从"主动预防"到"事后补救"：
    #   1) qps                   —— 客户端主动限速：请求排成队等，不去打撞服务端的墙
    #   2) batch-size / retry-* —— 加载时把请求摊开；真的撞限速了自动等 1s→2s→4s 指数退避重试
    #   3) 只有 429/5xx/网络异常才重试；401（Key 错）会立刻失败，不会让你干等 7 秒
    # 三层是递进的：正常情况根本不会触发第 2 层。
    # 以后有付费额度、或换到不限速的 embedding 服务时，把 qps 调大、delay 调小、batch 调大即可
    qps: 4
    batch-size: 4
    batch-delay-ms: 150
    max-retries: 3
    retry-delay-ms: 1000
  index:
    # 向量索引落盘位置（相对项目根目录）。
    # 有这个文件，应用重启后会自动恢复索引，不用重新 embedding 全部文档。
    # 【重要】索引和 embedding 模型是"绑定"的：改了 embedding.model 就必须重建索引
    # （把本文件和同名的 .stats 文件移走，重启后再点一次「加载文档」）。
    # 想重建索引：移走这两个文件即可，别直接删（万一要回退还能改回来）
    path: data/vector-index.json
  conversation:
    # 历史对话落盘位置。所有会话（含每条的引用来源）都存在这一个 JSON 文件里，
    # 重启应用不会丢，可以直接用文本编辑器打开看。
    # 想清空全部历史：停掉应用，删掉这个文件
    path: data/conversations.json
